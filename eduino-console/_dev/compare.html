<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시작화면 비교 · eduino-console</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bar: #16181d; --bar-2: #1f232a; --line: #2c313a;
    --ink: #e8eaf0; --ink-2: #9aa2b4; --ink-3: #6b7386;
    --a: #f0473a;      /* main = 이전 */
    --b: #11a06f;      /* 작업본 = 현재 */
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); background: #0d1016; color: var(--ink);
         display: flex; flex-direction: column; overflow: hidden; }

  /* ── 상단 바 ── */
  .bar { flex: none; display: flex; align-items: center; gap: 16px; height: 52px;
         padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .proj { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .proj span { color: var(--ink-3); font-weight: 500; }

  .group { display: flex; align-items: center; gap: 2px; background: var(--bar-2);
           border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .group button { appearance: none; border: 0; background: transparent; color: var(--ink-2);
                  font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px;
                  border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .group button:hover { color: var(--ink); }
  .group button[aria-pressed="true"] { background: #343a45; color: #fff; }

  .ab { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .chip { appearance: none; display: inline-flex; align-items: center; gap: 7px; font: inherit;
          font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 999px;
          background: var(--bar-2); border: 1px solid var(--line); color: var(--ink-3); cursor: pointer; }
  .chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .chip[data-side="a"].on { color: #fff; background: var(--a); border-color: var(--a); }
  .chip[data-side="b"].on { color: #fff; background: var(--b); border-color: var(--b); }

  .slider { display: none; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }
  body[data-mode="overlay"] .slider { display: flex; }
  .slider input { width: 120px; accent-color: var(--b); }

  .hint { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  kbd { background: var(--bar-2); border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 11px; color: var(--ink-2); }

  /* ── 무대 ── */
  .stage { flex: 1; min-height: 0; position: relative; background: #05070b; }
  /* 배경을 불투명하게 둔다 — 토글 모드에서 위 패널이 아래 패널을 완전히 가려야 한다.
     (폭을 좁히면 iframe 양옆이 비어서 아래가 비쳐 보이기 때문) */
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column;
           background: #05070b; }
  .frame > .tag { flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
                  padding: 5px 10px; color: #fff; display: flex; gap: 8px; }
  .frame > .tag em { font-style: normal; opacity: .72; font-weight: 600; }
  .frame[data-side="a"] > .tag { background: var(--a); }
  .frame[data-side="b"] > .tag { background: var(--b); }
  .frame .hold { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .frame iframe { flex: 1; width: 100%; max-width: var(--w, 100%); border: 0;
                  background: #fff; display: block; }

  /* 모드별 배치 */
  /* 토글은 display 로 숨기지 않고 z-index 로 겹친다.
     display:none 인 채 iframe 이 로드되면 그 안의 getBoundingClientRect() 가 전부 0 을
     반환한다. 캔버스로 그리는 페이지는 백킹 스토어가 1×1 로 잡히고, 나중에 보여줘도
     iframe 안에서는 resize 가 발생하지 않아 다시 재지 않는다 — 영영 빈 화면이 된다.
     겹쳐두면 양쪽 다 정상 크기로 렌더링되고, 전환도 즉시 이뤄진다. */
  body[data-mode="toggle"] .frame { z-index: 1; }
  body[data-mode="toggle"] .frame.active { z-index: 2; }

  body[data-mode="split"] .frame { width: 50%; }
  body[data-mode="split"] .frame[data-side="b"] { left: 50%; border-left: 1px solid var(--line); }

  body[data-mode="overlay"] .frame[data-side="b"] { opacity: var(--op, .5); }
</style>
</head>
<body data-mode="toggle">

<div class="bar">
  <div class="proj">eduino-console <span>· 시작화면</span></div>

  <div class="group" id="modes">
    <button data-mode="toggle"  aria-pressed="true">토글</button>
    <button data-mode="split"   aria-pressed="false">나란히</button>
    <button data-mode="overlay" aria-pressed="false">겹치기</button>
  </div>

  <div class="group" id="widths">
    <button data-w="100%"   aria-pressed="true">전체</button>
    <button data-w="1280px" aria-pressed="false">1280</button>
    <button data-w="768px"  aria-pressed="false">768</button>
    <button data-w="390px"  aria-pressed="false">390</button>
  </div>

  <div class="slider">
    <label for="op">겹침</label>
    <input type="range" id="op" min="0" max="100" value="50" />
  </div>

  <div class="group"><button id="reload">처음으로</button></div>

  <div class="ab">
    <span class="hint"><kbd>Space</kbd> 전환 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 모드 · <kbd>R</kbd> 처음으로</span>
    <button class="chip" data-side="a">main</button>
    <button class="chip" data-side="b">작업본</button>
  </div>
</div>

<div class="stage">
  <div class="frame" data-side="a">
    <div class="tag">A · main (이전) <em>링크를 눌러도 이전 버전 안에서 이동합니다</em></div>
    <div class="hold"><iframe data-src="/platform/index.html" title="main 버전"></iframe></div>
  </div>
  <div class="frame active" data-side="b">
    <div class="tag">B · 작업본 (편집 중인 파일) <em>고친 뒤 R 을 누르면 반영됩니다</em></div>
    <div class="hold"><iframe data-src="/platform/index.html" title="작업본"></iframe></div>
  </div>
</div>

<script>
/* A(main 스냅샷)는 별도 서버에서 온다. 두 버전이 절대경로로 서로를 링크하기 때문에
   각자 자기 폴더를 최상위로 하는 서버가 있어야 상세 페이지까지 버전이 유지된다.
   스냅샷 서버 포트는 작업본 포트 + 2 (compare.sh 와 맞춰둔 규칙). */
const BASE_ORIGIN = location.protocol + '//' + location.hostname + ':' + (Number(location.port) + 2);

const body   = document.body;
const frames = [...document.querySelectorAll('.frame')];
const chips  = [...document.querySelectorAll('.chip')];
let side = 'b';

function load(frame) {
  const f = frame.querySelector('iframe');
  const origin = frame.dataset.side === 'a' ? BASE_ORIGIN : '';
  f.src = origin + f.dataset.src + '?t=' + Date.now();
}
frames.forEach(load);

/* 두 프레임을 모두 띄워둔 채 표시만 바꾼다 — 깜빡임 없이 즉시 뒤집혀야 차이가 눈에 띈다. */
function show(next) {
  side = next;
  frames.forEach(f => f.classList.toggle('active', f.dataset.side === side));
  chips.forEach(c => c.classList.toggle('on', c.dataset.side === side));
}
function flip() { show(side === 'a' ? 'b' : 'a'); }
chips.forEach(c => c.addEventListener('click', () => show(c.dataset.side)));

function setMode(m) {
  body.dataset.mode = m;
  document.querySelectorAll('#modes button')
    .forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
}
document.getElementById('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setMode(b.dataset.mode);
});

document.getElementById('widths').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.frame iframe').forEach(f => f.style.setProperty('--w', b.dataset.w));
  document.querySelectorAll('#widths button')
    .forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

document.getElementById('op').addEventListener('input', e => {
  body.style.setProperty('--op', e.target.value / 100);
});

/* 양쪽을 시작화면으로 되돌린다. 편집 내용 반영과 위치 정렬을 겸한다.
   (A 는 다른 출처라 현재 위치를 읽을 수 없어, 제자리 새로고침 대신 처음으로 돌린다.) */
document.getElementById('reload').addEventListener('click', () => frames.forEach(load));

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); flip(); }
  else if (k === '1') setMode('toggle');
  else if (k === '2') setMode('split');
  else if (k === '3') setMode('overlay');
  else if (k === 'r') frames.forEach(load);
});

show('b');
</script>
</body>
</html>
