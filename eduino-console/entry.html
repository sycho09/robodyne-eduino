<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.png" />
<meta name="theme-color" content="#0a0b12" />
<title>입장 · VISION AI</title>
<meta name="robots" content="noindex" />
<!-- 역할 선택 화면(체험/수업 개설/수업 참여)은 걷어내고 체험 모드로 곧장 허브에 들어간다.
     기존 링크·북마크 호환을 위해 URL 만 남겨두고, 현재 선택된 UI안으로 즉시 이동한다. -->
<meta http-equiv="refresh" content="0; url=console/cards.html" />
<style>
  html,body{margin:0;height:100%;background:#0a0b12;color:#737c9c;
    font-family:'Pretendard',system-ui,sans-serif;display:grid;place-items:center;}
  a{color:#6aa6ff;font-size:14px;}
</style>
<script>
  /* 콘솔 공통 셸을 통째로 불러올 필요 없이 진입 모드만 세팅하고 선택된 안으로 보낸다
     (shared.js 의 VARIANTS 와 같은 목록) */
  (function () {
    try { sessionStorage.setItem('vision_session', JSON.stringify({ mode: 'free' })); } catch (e) {}
    var URLS = {
      map: 'console/map.html', cards: 'console/cards.html'
    };
    var v; try { v = localStorage.getItem('vision_ui_variant'); } catch (e) {}
    location.replace(URLS[v] || URLS.cards);
  })();
</script>
</head>
<body>
<noscript><a href="console/cards.html">비전 콘솔 허브로 이동 →</a></noscript>
</body>
</html>
