<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../favicon.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<meta name="theme-color" content="#0a0b12" />
<title>VISION STUDIO · 카드 캐러셀</title>
<meta name="description" content="비전 스튜디오 콘솔 — 게임팩 카드를 넘겨 스테이지를 고르고 바로 시작합니다." />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<!-- 공통 셸(항목 데이터·인트로·HUD·세션·사운드·진행)은 console/shared.js 하나에서 관리 -->
<script src="../shared/base-path.js"></script>
<script src="shared.js"></script>
<link rel="stylesheet" href="css/shared.css" />

<link rel="stylesheet" href="css/cards.css" />
<link rel="stylesheet" href="../stages/submission/css/board.css" />
</head>
<body>

<div class="v-boot" id="vboot"></div>
<div class="v-amb" id="vamb"></div>
<div class="v-scan"></div>

<header id="vhud"></header>

<main class="stage">
  <!-- 탭 내용은 VStudio.tabs() 가 TRACKS 에서 그린다 (라벨·개수 복붙 금지) -->
  <div class="topbar">
    <div id="tabs"></div>
  </div>

  <h1 class="stage-title" id="title">스테이지를 <b>골라 입장</b>하세요</h1>

  <div class="carousel">
    <button class="arrow left" id="prev" aria-label="이전">‹</button>
    <div class="track" id="packs"></div>
    <button class="arrow right" id="next" aria-label="다음">›</button>
  </div>
</main>

<footer class="foot">
  <div class="infobar" id="infobar"></div>
  <button class="enter" id="enter">입장하기 <span class="ar">→</span></button>
  <div class="dots" id="dots"></div>
</footer>

<script src="../stages/core/ui/icons.js"></script>
<script src="../stages/core/session.js"></script>
<script src="../stages/admin/cert.js"></script>
<script src="../stages/submission/board.js"></script>
<script src="js/cards.js"></script>
</body>
</html>
