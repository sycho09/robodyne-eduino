<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>코스 상세 — Eduino AI</title>
  <meta name="description" content="Eduino AI 코스 상세 — 동작 미리보기·학습 목표·학습 흐름·준비물을 한눈에." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./css/course.css" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./index.html"><img class="logo-img" src="./img/logo.webp"
          alt="Eduino AI" /></a>
      <nav class="nav">
        <a class="link" href="./index.html#modules">코스</a>
        <a class="btn btn-primary nav-cta" id="nav-cta" href="#">체험 시작 →</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="chero">
      <div class="crumb"><a href="./index.html">Eduino AI</a> › <a href="./index.html#modules">코스</a> ›
        <span id="cr-name">코스</span>
      </div>
      <div class="chead">
        <div class="cic" id="c-ic"></div>
        <div>
          <h1 id="c-name">코스</h1>
          <p class="tagline" id="c-tag"></p>
          <div class="chero-cta">
            <a class="btn btn-primary btn-lg" id="c-start" href="#">체험 시작 →</a>
            <a class="btn btn-ghost btn-lg" href="#guide">진행 방식 보기 ↓</a>
          </div>
        </div>
      </div>
    </section>

    <!-- 동작 미리보기 -->
    <section class="blk">
      <div class="sh">
        <h2>동작 미리보기</h2><span class="sub">학습 · 추론이 실제로 이렇게 동작해요</span>
      </div>
      <div class="demo">
        <div class="demo-feats" id="demo-feats"></div>
        <div class="demo-stage">
          <span class="live" id="demo-live">LIVE</span>
          <canvas id="demo-canvas"></canvas>
          <img id="demo-gif" alt="" hidden />
        </div>
        <div class="demo-side">
          <div class="pipe">
            <div class="pnode in"><span class="pic"></span><span><b>입력</b><span class="pt" id="demo-in">입력</span></span></div>
            <div class="pconn"></div>
            <div class="pnode proc"><span class="pic"></span><span><b>학습 · 추론</b><span class="pt" id="demo-proc">처리</span></span></div>
            <div class="pconn"></div>
            <div class="pnode out"><span class="pic"></span><span><b>출력</b><span class="pt" id="demo-out">출력</span></span></div>
          </div>
          <div class="demo-cap" id="demo-cap"></div>
        </div>
      </div>
    </section>

    <!-- 이 코스에서 배우는 것 -->
    <section class="blk">
      <div class="sh">
        <h2>이 코스에서 배우는 것</h2>
      </div>
      <div class="grid2" id="c-learn"></div>
    </section>

    <!-- 이 코스는 이렇게 진행돼요 (가이드라인 대체용 4단계) -->
    <section class="blk" id="guide">
      <div class="sh">
        <h2>이 코스는 이렇게 진행돼요</h2><span class="sub">체험 시작을 누르면 만나는 4단계</span>
      </div>
      <div class="flow" id="c-steps"></div>
      <div class="flow-note" id="c-freenote"></div>
    </section>

    <section class="blk">
      <div class="sh">
        <h2>다른 코스</h2>
      </div>
      <div class="other" id="c-other"></div>
    </section>
  </main>
  <footer>© 2026 Eduino AI · 보고 만지며 배우는 AI 수업</footer>

  <script src="./feature-data.js"></script>
  <script src="./js/course/data.js"></script>
  <script src="./js/course/render.js"></script>
  <script src="./js/course/canvas.js"></script>
  <script src="./js/course/main.js"></script>
</body>

</html>
