<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../favicon.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<meta name="theme-color" content="#f6f7fb" />
<title>코스 상세 — Eduino AI</title>
<meta name="description" content="Eduino AI 코스 상세 — 동작 미리보기·학습 목표·학습 흐름·준비물을 한눈에." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="./css/course.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="back" href="../modules/index.html">← 코스 목록</a>
    <a class="brand" href="./index.html"><img class="logo-img" src="./img/logo.webp" alt="Eduino AI" /></a>
    <a class="btn btn-primary nav-cta" id="nav-cta" href="#">체험 시작 →</a>
  </div>
</header>

<main>
  <section class="chero">
    <div class="crumb"><a href="./index.html">Eduino AI</a> › <a href="../modules/index.html">코스</a> › <span id="cr-name">코스</span></div>
    <div class="chead">
      <div class="cic" id="c-ic"></div>
      <div>
        <h1 id="c-name">코스</h1>
        <p class="tagline" id="c-tag"></p>
        <div class="chips" id="c-chips"></div>
        <div class="chero-cta">
          <a class="btn btn-primary btn-lg" id="c-start" href="#">체험 시작 →</a>
          <a class="btn btn-ghost btn-lg" href="./sample.html">맛보기 샘플 체험</a>
        </div>
      </div>
    </div>
  </section>

  <section class="blk"><div class="sh"><h2>동작 미리보기</h2><span class="sub">학습 · 추론이 실제로 이렇게 동작해요</span></div>
    <div class="demo">
      <div class="demo-feats" id="demo-feats"></div>
      <div class="demo-stage">
        <span class="live">LIVE</span>
        <canvas class="demo-canvas"></canvas>
      </div>
      <div class="demo-side">
        <div class="pipe">
          <div class="pnode in"><span class="pic">🎛️</span><span><b>입력</b><span class="pt demo-in">입력</span></span></div>
          <div class="pconn"></div>
          <div class="pnode proc"><span class="pic">🧠</span><span><b>학습 · 추론</b><span class="pt demo-proc">처리</span></span></div>
          <div class="pconn"></div>
          <div class="pnode out"><span class="pic">✅</span><span><b>출력</b><span class="pt demo-out">출력</span></span></div>
        </div>
        <div class="demo-cap"></div>
      </div>
    </div>
  </section>

  <section class="blk"><div class="sh"><h2>이 코스에서 배우는 것</h2></div>
    <div class="grid2" id="c-learn"></div>
  </section>

  <section class="blk"><div class="sh"><h2>학습 흐름</h2><span class="sub">체험 → 제작 → 응용</span></div>
    <div class="flow" id="c-curr"></div>
  </section>

  <section class="blk"><div class="twocol">
    <div>
      <div class="sh"><h2>준비물 &amp; 환경</h2></div>
      <div class="panel"><div class="needs" id="c-needs"></div>
        <div class="techs" id="c-tech"></div>
      </div>
    </div>
    <div>
      <div class="sh"><h2>교사 팁</h2></div>
      <div class="tip" id="c-tip"></div>
    </div>
  </div></section>

  <section class="blk"><div class="sh"><h2>다른 코스</h2></div>
    <div class="other" id="c-other"></div>
  </section>
</main>
<footer>© 2026 Eduino AI · 보고 만지며 배우는 AI 수업</footer>

<script src="../shared/base-path.js"></script>
<script src="../modules/shared/course-preview.js"></script>
<script src="./js/course.js"></script>
</body>
</html>
